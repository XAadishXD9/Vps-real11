<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage VPS - ZX NODES</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="table-container">
        <h1>Manage VPS</h1>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Actions</th>
                    <th>SSH</th>
                </tr>
            </thead>
            <tbody>
                {% for vps in vps_list %}
                <tr>
                    <td>{{ vps.name }}</td>
                    <td>{{ vps.status }}</td>
                    <td>
                        <form method="POST" action="/manage">
                            <input type="hidden" name="vps_name" value="{{ vps.name }}">
                            <button name="action" value="start">Start</button>
                            <button name="action" value="stop">Stop</button>
                            <button name="action" value="restart">Restart</button>
                            <button name="action" value="delete">Delete</button>
                        </form>
                    </td>
                    <td>
                        <a href="https://tmage.io/?host={{ vps.name }}&user=root" target="_blank">
                            <img src="{{ url_for('static', filename='ssh.png') }}" class="ssh-icon">
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/panel" class="back-btn">Back to Dashboard</a>
    </div>
</body>
</html>
