<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create VPS - ZX NODES</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="form-container">
        <h1>Create New VPS</h1>
        <form method="POST">
            <input type="text" name="name" placeholder="VPS Name" required>
            <input type="number" name="memory" placeholder="Memory (MB)" required>
            <input type="number" name="vcpu" placeholder="CPU Cores" required>
            <input type="number" name="disk" placeholder="Disk Size (GB)" required>
            <input type="text" name="iso" placeholder="ISO Path (/root/ubuntu.iso)" required>
            <button type="submit">Create VPS</button>
        </form>
        <a href="/panel" class="back-btn">Back to Dashboard</a>
    </div>
</body>
</html>
