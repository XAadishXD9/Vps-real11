{% extends "base.html" %}
{% block title %}Create VPS - ZX NODES{% endblock %}
{% block content %}
<div class="card" style="max-width:500px; margin:auto; padding:30px;">
<h2 class="text-center mb-4">Create New VPS</h2>
<form method="post">
    <div class="mb-3"><label>Owner</label><input type="text" name="owner" class="form-control" required></div>
    <div class="mb-3"><label>Memory (MB)</label><input type="number" name="memory" class="form-control" required></div>
    <div class="mb-3"><label>CPU Cores</label><input type="number" name="cpu" class="form-control" required></div>
    <div class="mb-3"><label>Disk (GB)</label><input type="number" name="disk" class="form-control" required></div>
    <button type="submit" class="btn btn-primary w-100">Create VPS</button>
</form>
</div>
{% endblock %}
